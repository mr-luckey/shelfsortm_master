name: shelfsortm_master
description: "ShelfSort Master — 3D goods sorting puzzle for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  audioplayers: ^6.7.1
  confetti: ^0.8.0
  connectivity_plus: ^7.3.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  google_fonts: ^8.2.0
  google_mobile_ads: ^6.0.0
  in_app_purchase: ^3.2.3
  intl: ^0.20.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    - assets/images/premium/toys/
    - assets/images/premium/ui/
    - assets/images/premium/cupboards/
    - assets/images/emojis/activities/
    - assets/images/emojis/animals/
    - assets/images/emojis/food/
    - assets/images/emojis/hands/
    - assets/images/emojis/objects/
    - assets/images/emojis/people/
    - assets/images/emojis/people_activities/
    - assets/images/emojis/people_professions/
    - assets/images/emojis/smilies/
    - assets/images/emojis/symbols/
    - assets/images/emojis/travel/
    - assets/images/rooms/
    - assets/images/brand/
    - assets/audio/
